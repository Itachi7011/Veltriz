# NOTE on splat pattern: every rule below uses "/api/prefix*" (NO slash
# before the "*") rather than "/api/prefix/*". This matters — Netlify's
# splat requires a literal "/" to already be in the request path before it
# will match anything, so "/api/jobs/*" would silently NOT match a bare
# request to exactly "/api/jobs" (no trailing slash/segment), even though
# that's a real call this app makes (see JobPanel.jsx, MarketPanel.jsx,
# CharacterCreate.jsx). Vite's dev proxy doesn't have this gotcha (it
# matches by simple prefix), which is why this only breaks in production
# and is easy to miss in local testing. "/api/jobs*" (no slash) correctly
# matches both "/api/jobs" and "/api/jobs/apply".

[[redirects]]
  from = "/api/auth*"
  to = "https://veltriz-auth-service.onrender.com/api/auth:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/wallet*"
  to = "https://veltriz-economy-service.onrender.com/api/wallet:splat"
  status = 200
  force = true

